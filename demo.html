<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suburban Tours — Demo (keyless)</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
  html, body { margin: 0; height: 100%; background: #0b0d12; }
  #map { position: fixed; inset: 0; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10; width: 300px;
    max-width: calc(100vw - 24px);
    background: rgba(18,21,28,.92); border: 1px solid #2a2f3a;
    border-radius: 12px; padding: 14px; backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .tag { font-size: 11px; color: #6b7280; margin-bottom: 8px; }
  label { display:block; font-size:11px; color:#9aa4b2; margin:8px 0 3px; }
  input { width:100%; box-sizing:border-box; padding:8px 9px; background:#11141b;
    border:1px solid #2a2f3a; border-radius:8px; color:#e8ecf3; font-size:13px; }
  input:focus { outline:none; border-color:#4c7dff; }
  .settings { display:flex; gap:8px; }
  .settings > div { flex:1; }
  #go { width:100%; margin-top:12px; padding:10px; border:0; border-radius:8px;
    background:#4c7dff; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  #go:disabled { opacity:.5; cursor:default; }
  #status { margin-top:10px; font-size:12px; color:#9aa4b2; min-height:16px; line-height:1.4; }
  #status.err { color:#ff8080; }
  summary { font-size:12px; color:#9aa4b2; cursor:pointer; margin-top:8px; }
</style>

<div id="map"></div>

<div id="panel">
  <h1>🧱 Suburban Tours — Demo</h1>
  <div class="tag">keyless · OpenFreeMap · OSRM-Route</div>

  <label>Start</label>
  <input id="start" value="Freiburg Münster" />
  <label>Ziel</label>
  <input id="end" value="Freiburg Hauptbahnhof" />

  <details>
    <summary>Kamera</summary>
    <div class="settings">
      <div><label>Pitch (°)</label><input id="camPitch" type="number" value="75" /></div>
      <div><label>Zoom</label><input id="camZoom" type="number" value="17" step="0.5" /></div>
      <div><label>km/h</label><input id="camSpeed" type="number" value="45" /></div>
    </div>
  </details>

  <button id="go">Tour starten</button>
  <div id="status"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const setStatus = (m, e = false) => { statusEl.textContent = m; statusEl.className = e ? "err" : ""; };

  const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [7.85, 48.0],
    zoom: 15,
    pitch: 60,
    maxPitch: 80,
    attributionControl: true,
  });

  // --- Geo-Helfer (reine Mathe) ---
  const R = 6378137;
  const rad = (d) => (d * Math.PI) / 180, deg = (r) => (r * 180) / Math.PI;
  function distance(a, b) {
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 +
      Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function bearing(a, b) {
    const y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
    const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) -
      Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lng - a.lng));
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  const interp = (a, b, f) => ({ lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f });

  async function geocode(q) {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(q);
    const r = await fetch(url, { headers: { "Accept-Language": "de" } });
    const j = await r.json();
    if (!j.length) throw new Error("Nicht gefunden: " + q);
    return { lat: +j[0].lat, lng: +j[0].lon };
  }

  async function route(a, b) {
    const url = `https://router.project-osrm.org/route/v1/driving/` +
      `${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const r = await fetch(url);
    const j = await r.json();
    if (!j.routes || !j.routes.length) throw new Error("Keine Route gefunden.");
    return j.routes[0].geometry.coordinates.map(([lng, lat]) => ({ lat, lng }));
  }

  function buildTrack(pts) {
    const dist = [0];
    for (let i = 1; i < pts.length; i++) dist.push(dist[i - 1] + distance(pts[i - 1], pts[i]));
    return { pts, dist, total: dist[dist.length - 1] };
  }
  function sampleTrack(t, d) {
    let i = 1;
    while (i < t.dist.length && t.dist[i] < d) i++;
    if (i >= t.pts.length) i = t.pts.length - 1;
    const a = t.pts[i - 1], b = t.pts[i];
    const seg = t.dist[i] - t.dist[i - 1] || 1;
    const f = Math.min(1, Math.max(0, (d - t.dist[i - 1]) / seg));
    return { ...interp(a, b, f), heading: bearing(a, b) };
  }

  // Route-Linie zeichnen
  function drawRoute(pts) {
    const geo = { type: "Feature", geometry: { type: "LineString",
      coordinates: pts.map((p) => [p.lng, p.lat]) } };
    if (map.getSource("route")) { map.getSource("route").setData(geo); return; }
    map.addSource("route", { type: "geojson", data: geo });
    map.addLayer({ id: "route", type: "line", source: "route",
      paint: { "line-color": "#4c7dff", "line-width": 5, "line-opacity": 0.8 } });
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function flyTour(track) {
    const pitch = Number($("camPitch").value) || 68;
    const zoom = Number($("camZoom").value) || 17;
    const speed = Math.max(5, Number($("camSpeed").value) || 45) / 3.6;
    const start = sampleTrack(track, 0);

    // Einflug — bewusst NICHT vom moveend-Event abhängig (feuert unzuverlässig)
    setStatus("Fliege zum Start…");
    map.flyTo({ center: [start.lng, start.lat], zoom, pitch, bearing: start.heading, duration: 2000 });
    await wait(2100);

    setStatus("Tour läuft… ▶");
    const totalTime = (track.total / speed) * 1000;
    return new Promise((resolve) => {
      let t0 = null;
      function frame(ts) {
        if (t0 == null) t0 = ts;
        const f = Math.min(1, (ts - t0) / totalTime);
        const s = sampleTrack(track, f * track.total);
        map.jumpTo({ center: [s.lng, s.lat], bearing: s.heading, pitch, zoom });
        if (f < 1) requestAnimationFrame(frame);
        else { setStatus("Angekommen 🏁"); resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  $("go").addEventListener("click", async () => {
    $("go").disabled = true;
    try {
      setStatus("Suche Adressen…");
      const a = await geocode($("start").value.trim());
      const b = await geocode($("end").value.trim());
      setStatus("Berechne Route…");
      const pts = await route(a, b);
      drawRoute(pts);
      await flyTour(buildTrack(pts));
    } catch (e) {
      console.error(e);
      setStatus(e.message || String(e), true);
    } finally {
      $("go").disabled = false;
    }
  });
</script>
