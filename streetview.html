<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suburban Tours — Street View</title>

<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
  html, body { margin: 0; height: 100%; background: #0b0d12; }
  .stage { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
  #panel {
    position: fixed; top: 12px; left: 12px; z-index: 10; width: 300px;
    max-width: calc(100vw - 24px);
    background: rgba(18,21,28,.92); border: 1px solid #2a2f3a;
    border-radius: 12px; padding: 14px; backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  label { display:block; font-size:11px; color:#9aa4b2; margin:8px 0 3px; }
  input { width:100%; box-sizing:border-box; padding:8px 9px; background:#11141b;
    border:1px solid #2a2f3a; border-radius:8px; color:#e8ecf3; font-size:13px; }
  input:focus { outline:none; border-color:#4c7dff; }
  .settings { display:flex; gap:8px; }
  .settings > div { flex:1; }
  .ac-wrap { position: relative; }
  .ac-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 30;
    background: #11141b; border: 1px solid #4c7dff; border-top: 0;
    border-radius: 0 0 8px 8px; max-height: 190px; overflow-y: auto; display: none; }
  .ac-list.show { display: block; }
  .ac-item { padding: 7px 9px; font-size: 12px; color: #e8ecf3; cursor: pointer; }
  .ac-item:hover, .ac-item.active { background: #2a2f3a; }
  .ac-item small { color: #9aa4b2; }
  #go { width:100%; margin-top:12px; padding:10px; border:0; border-radius:8px;
    background:#4c7dff; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  #go:disabled { opacity:.5; cursor:default; }
  #status { margin-top:10px; font-size:12px; color:#9aa4b2; min-height:16px; line-height:1.4; }
  #status.err { color:#ff8080; }
  summary { font-size:12px; color:#9aa4b2; cursor:pointer; margin-top:8px; }
  .hint { font-size:11px; color:#6b7280; margin-top:10px; line-height:1.4; }
  .hint a { color:#7aa0ff; }

  #controls {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 20; display: none; align-items: center; gap: 14px;
    background: rgba(18,21,28,.92); border: 1px solid #2a2f3a;
    border-radius: 999px; padding: 8px 16px; backdrop-filter: blur(8px);
    box-shadow: 0 8px 30px rgba(0,0,0,.5); color: #e8ecf3; font-size: 13px;
  }
  #controls.show { display: flex; }
  #pause { border:0; background:#4c7dff; color:#fff; width:38px; height:38px;
    border-radius:50%; font-size:15px; cursor:pointer; flex:0 0 auto; }
  #controls .speed { display:flex; align-items:center; gap:8px; }
  #controls .speed span { color:#9aa4b2; font-size:11px; white-space:nowrap; }
  #controls input[type=range] { width:130px; accent-color:#4c7dff; }
  #prog { color:#9aa4b2; font-variant-numeric: tabular-nums; min-width:56px; text-align:right; }

  #minimap {
    position: fixed; left: 12px; bottom: 16px; z-index: 15;
    width: 240px; height: 170px; border-radius: 10px; overflow: hidden;
    border: 1px solid #2a2f3a; box-shadow: 0 6px 24px rgba(0,0,0,.5); display: none;
  }
  #minimap.show { display: block; }
  #minimap-inner { width: 100%; height: 100%; }

  #usage {
    position: fixed; top: 12px; right: 12px; z-index: 15;
    background: rgba(18,21,28,.9); border: 1px solid #2a2f3a; border-radius: 8px;
    padding: 7px 11px; font-size: 11px; line-height: 1.4; color: #9aa4b2; max-width: 230px;
  }
  #usage b { color: #e8ecf3; font-variant-numeric: tabular-nums; }
  #usage.warn b { color: #ffb020; }
  #usage.over b { color: #ff8080; }

  /* Menü einklappen */
  #collapse { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px;
    border: 0; border-radius: 6px; background: #2a2f3a; color: #e8ecf3; cursor: pointer; font-size: 15px; line-height: 1; }
  #panel.hidden { display: none; }
  #menuToggle { position: fixed; top: 12px; left: 12px; z-index: 12; display: none;
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid #2a2f3a;
    background: rgba(18,21,28,.92); color: #e8ecf3; font-size: 18px; cursor: pointer; }
  #menuToggle.show { display: block; }

  /* Pause-Werkzeuge (nur im Pause-Modus) */
  #pauseTools { display: none; align-items: center; gap: 6px; }
  #controls.paused #pauseTools { display: flex; }
  #pauseTools button { border: 0; background: #2a2f3a; color: #e8ecf3; width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer; font-size: 14px; }
  #pauseTools button.on { background: #f5c518; color: #111; }

  /* kleine Zoom-Buttons für die Mini-Karte */
  #miniZoom { position: absolute; right: 6px; bottom: 6px; z-index: 5;
    display: flex; flex-direction: column; gap: 3px; }
  #miniZoom button { width: 22px; height: 22px; border: 0; border-radius: 4px;
    background: rgba(18,21,28,.9); color: #e8ecf3; font-size: 15px; line-height: 1; cursor: pointer; }
</style>

<div id="panoA" class="stage"></div>

<div id="panel">
  <button id="collapse" title="Menü einklappen">–</button>
  <h1>🛣️ Suburban Tours — Street View</h1>

  <label>Google Maps API-Key</label>
  <input id="key" type="password" placeholder="AIza…" autocomplete="off" />
  <label>Start</label>

  <div class="hint">

    Maps JavaScript API · Street View Static API · Directions API · Geocoding API.<br />
    <a href="https://console.cloud.google.com/google/maps-apis/api-list" target="_blank"
      >APIs aktivieren →</a>

</div>

  <div id="minimap-inner"></div>
  <div id="miniZoom"><button id="miniIn" title="Zoom +">+</button><button id="miniOut" title="Zoom −">−</button></div>
</div>

<div id="controls">
  <button id="pause" title="Pause / Weiter">⏸</button>
  <span id="pauseTools">
    <button id="back" title="Vorheriger Stopp">◀</button>
    <button id="fav" title="Als Favorit merken">★</button>
    <button id="openmaps" title="In Google Maps öffnen">🔗</button>
  </span>

<script>
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const setStatus = (m, e = false) => { statusEl.textContent = m; statusEl.className = e ? "err" : ""; };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  $("key").value = localStorage.getItem("gmapsKey") || "";

  // Lokaler Verbrauchszähler (Schätzung!) — echtes Kontingent gibt's nur in der Cloud Console.
  const FREE_PER_MONTH = 5000; // grobes Gratis-Kontingent Street View / Monat
  const usageMonth = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1); };
  function getUsage() {
    try { const o = JSON.parse(localStorage.getItem("svUsage") || "{}");
      return o.month === usageMonth() ? o : { month: usageMonth(), count: 0 };
    } catch (e) { return { month: usageMonth(), count: 0 }; }
  }
  function renderUsage() {
    const o = getUsage(), left = FREE_PER_MONTH - o.count;
    const el = $("usage");
    el.className = left <= 0 ? "over" : left < 500 ? "warn" : "";
    el.innerHTML = `Street-View-Anfragen (geschätzt)<br>diesen Monat: <b>${o.count}</b><br>` +
      (left > 0 ? `gratis übrig: ~<b>${left}</b>` : `<b>Gratis-Limit erreicht</b>`);
  }
  function bumpUsage(n) {
    const o = getUsage(); o.count += n;
    localStorage.setItem("svUsage", JSON.stringify(o));
    renderUsage();
  }
  renderUsage();

  let mapsLoaded = false, panoA, svService, miniMap, miniMarker, routeLine = null, routePathCoords = [];

  // Googles offizieller Bootstrap-Loader — stellt google.maps.importLibrary bereit
  function bootstrapGoogleMaps(key) {
    ((g) => {
      let h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary",
        q = "__ib__", m = document, b = window;
      b = b[c] || (b[c] = {});
      const d = b.maps || (b.maps = {}), r = new Set(), e = new URLSearchParams(),
        u = () => h || (h = new Promise(async (f, n) => {
          await (a = m.createElement("script"));
          e.set("libraries", [...r] + "");
          for (k in g) e.set(k.replace(/[A-Z]/g, (t) => "_" + t[0].toLowerCase()), g[k]);
          e.set("callback", c + ".maps." + q);
          a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
          d[q] = f;
          a.onerror = () => (h = n(Error(p + " could not load.")));
          a.nonce = m.querySelector("script[nonce]")?.nonce || "";
          m.head.append(a);
        }));
      d[l] ? console.warn(p + " only loads once. Ignoring:", g) : (d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)));
    })({ key, v: "weekly" });
  }

  async function loadGoogleMaps(key) {
    if (mapsLoaded) return;
    bootstrapGoogleMaps(key);
    await Promise.all([
      google.maps.importLibrary("streetView"),
      google.maps.importLibrary("maps"),
      google.maps.importLibrary("routes"),
      google.maps.importLibrary("geocoding"),
      google.maps.importLibrary("geometry"),
      google.maps.importLibrary("core"),
    ]);
    mapsLoaded = true;
  }

  // Keyless Geocoding via Nominatim (OpenStreetMap) — kein Google nötig
  async function geocode(address) {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(address);
    const r = await fetch(url, { headers: { "Accept-Language": "de" } });
    const j = await r.json();
    if (!j.length) throw new Error("Nicht gefunden: " + address);
    return new google.maps.LatLng(+j[0].lat, +j[0].lon);
  }

  // Ort auflösen: bevorzugt die per Autovervollständigung gewählten Koordinaten,
  // sonst frei getippten Text via Nominatim geocoden.
  async function resolveLocation(input) {
    if (input._picked) return new google.maps.LatLng(input._picked.lat, input._picked.lng);
    return geocode(input.value.trim());
  }

  // Keyless Autovervollständigung via Photon (OpenStreetMap, für Type-ahead gebaut)
  function attachAutocomplete(input, listEl) {
    let timer = null, items = [], active = -1;
    const hide = () => { listEl.classList.remove("show"); active = -1; };
    const render = () => {
      listEl.innerHTML = "";
      items.forEach((it, idx) => {
        const div = document.createElement("div");
        div.className = "ac-item" + (idx === active ? " active" : "");
        div.textContent = it.main;
        if (it.ctx) { const s = document.createElement("small"); s.textContent = " " + it.ctx; div.appendChild(s); }
        div.addEventListener("mousedown", (e) => { e.preventDefault(); choose(idx); });
        listEl.appendChild(div);
      });
      listEl.classList.toggle("show", items.length > 0);
    };
    const choose = (idx) => {
      const it = items[idx]; if (!it) return;
      input.value = it.label;
      input._picked = { lat: it.lat, lng: it.lng };
      hide();
    };
    async function query(q) {
      try {
        const r = await fetch("https://photon.komoot.io/api/?lang=de&limit=6&q=" + encodeURIComponent(q));
        const j = await r.json();
        items = (j.features || []).map((f) => {
          const p = f.properties, c = f.geometry.coordinates;
          const main = p.name || [p.street, p.housenumber].filter(Boolean).join(" ") || p.city || "?";
          const ctx = [p.city, p.state, p.country].filter((x) => x && x !== main).join(", ");
          return { main, ctx, label: main + (ctx ? ", " + ctx : ""), lat: c[1], lng: c[0] };
        });
        render();
      } catch (e) { hide(); }
    }
    input.addEventListener("input", () => {
      input._picked = null;
      const q = input.value.trim();
      clearTimeout(timer);
      if (q.length < 3) { hide(); return; }
      timer = setTimeout(() => query(q), 250);
    });
    input.addEventListener("keydown", (e) => {
      if (!listEl.classList.contains("show")) return;
      if (e.key === "ArrowDown") { active = Math.min(items.length - 1, active + 1); render(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { active = Math.max(0, active - 1); render(); e.preventDefault(); }
      else if (e.key === "Enter" && active >= 0) { choose(active); e.preventDefault(); }
      else if (e.key === "Escape") hide();
    });
    input.addEventListener("blur", () => setTimeout(hide, 150));
  }
  attachAutocomplete($("start"), $("ac-start"));
  attachAutocomplete($("end"), $("ac-end"));

  // Router-Auswahl: ohne Meide-Option keyless über OSRM; mit Meide-Option über Google
  // (Directions API). Fällt bei Fehler (API nicht aktiv) sauber auf OSRM zurück.
  async function routePath(origin, destination) {
    const avoid = {
      avoidHighways: $("avoidHw").checked,
      avoidTolls: $("avoidToll").checked,
      avoidFerries: $("avoidFerry").checked,
    };
    if (avoid.avoidHighways || avoid.avoidTolls || avoid.avoidFerries) {
      try { return await googleRoute(origin, destination, avoid); }
      catch (e) {
        console.warn("Google-Routing fehlgeschlagen, nutze OSRM:", e.message || e);
        setStatus("Meide-Option braucht Directions API — nutze Normalroute", true);
        await sleep(1500);
      }
    }
    return await osrmRoute(origin, destination);
  }

  // Google DirectionsService — kann Autobahnen/Maut/Fähren meiden (echte befahrbare Straßen)
  async function googleRoute(origin, destination, avoid) {
    await google.maps.importLibrary("routes");
    const ds = new google.maps.DirectionsService();
    const res = await ds.route({
      origin, destination, travelMode: google.maps.TravelMode.DRIVING,
      avoidHighways: avoid.avoidHighways, avoidTolls: avoid.avoidTolls, avoidFerries: avoid.avoidFerries,
    });
    const route = res.routes[0];
    const path = route.overview_path.slice();
    // Navi-Punkte: Manöver-/Step-Grenzen (gröber als OSRM, aber Google liefert keine Kreuzungsliste)
    const waypoints = [];
    for (const leg of route.legs) {
      for (const step of leg.steps) waypoints.push(step.start_location);
      waypoints.push(leg.end_location);
    }
    return { path, waypoints };
  }

  // Keyless Routing via OSRM — dichter Fahr-Pfad + alle Kreuzungen/Knoten
  async function osrmRoute(origin, destination) {
    const url = "https://router.project-osrm.org/route/v1/driving/" +
      `${origin.lng()},${origin.lat()};${destination.lng()},${destination.lat()}` +
      "?overview=full&geometries=geojson&steps=true";
    const r = await fetch(url);
    const j = await r.json();
    if (!j.routes || !j.routes.length) throw new Error("Keine Route gefunden.");
    const route = j.routes[0];
    const path = route.geometry.coordinates.map(([lng, lat]) => new google.maps.LatLng(lat, lng));
    // ALLE Kreuzungen/Knoten entlang der Route (auch Ausfahrten, an denen man vorbeifährt)
    const waypoints = [], seenPt = new Set();
    for (const leg of route.legs || [])
      for (const step of leg.steps || [])
        for (const it of step.intersections || [])
          if (it.location) {
            const [lng, lat] = it.location;
            const key = lat.toFixed(5) + "," + lng.toFixed(5);
            if (!seenPt.has(key)) { seenPt.add(key); waypoints.push(new google.maps.LatLng(lat, lng)); }
          }
    return { path, waypoints };
  }

  // Panoramen werden LAZY entlang der Route gesucht — immer nur ein paar voraus,
  // nicht die ganze Route vorab. So startet es sofort, und eine lange Route
  // kostet nur so viel API, wie man tatsächlich abfährt.
  const BUFFER = 5;
  let panoList = [], consumerIdx = 0, producerDone = false, gen = 0;

  async function startProducer(rawPath, radius, stepM, naviPoints, myGen) {
    const sph = google.maps.geometry.spherical;
    const seen = new Set();
    // ein Punkt → nächstes Panorama suchen und (falls neu) anhängen
    const emit = async (pt) => {
      while (myGen === gen && panoList.length > consumerIdx + BUFFER) await sleep(60);
      if (myGen !== gen) return false;
      const loc = await nearestPano(pt, radius);
      if (loc && !seen.has(loc.pano)) {
        seen.add(loc.pano);
        panoList.push({ pano: loc.pano, latLng: loc.latLng });
      }
      return true;
    };

    // Navi-Modus: an jeder Kreuzung halten, aber nie weiter als maxJump springen
    // (auf der Autobahn ohne Ausfahrt gibt's dann alle ~10 km einen Zwischenstopp)
    if (naviPoints) {
      const maxJump = Math.max(500, (Number($("maxjump").value) || 10) * 1000);
      const stops = [];
      let prev = null;
      for (const p of naviPoints) {
        if (prev) {
          const gap = sph.computeDistanceBetween(prev, p);
          const n = Math.floor(gap / maxJump);
          for (let k = 1; k <= n; k++) stops.push(sph.interpolate(prev, p, (k * maxJump) / gap));
        }
        stops.push(p);
        prev = p;
      }
      for (const pt of stops) {
        if (myGen !== gen) return;
        if (!(await emit(pt))) return;
      }
      if (myGen === gen) producerDone = true;
      return;
    }

    // Normal: gleichmäßig alle stepM Meter abtasten
    let acc = 0; // zurückgelegte Strecke seit dem letzten Abtastpunkt
    for (let s = 1; s < rawPath.length && myGen === gen; s++) {
      const a = rawPath[s - 1], b = rawPath[s];
      const segLen = sph.computeDistanceBetween(a, b);
      if (segLen === 0) continue;
      let pos = 0; // schon verbrauchte Strecke auf diesem Segment
      // Abtastpunkte alle stepM Meter ENTLANG DER GESAMTSTRECKE setzen (nicht pro Rohsegment)
      while (segLen - pos >= stepM - acc && myGen === gen) {
        pos += stepM - acc;
        acc = 0;
        while (myGen === gen && panoList.length > consumerIdx + BUFFER) await sleep(60);
        if (myGen !== gen) return;
        const loc = await nearestPano(sph.interpolate(a, b, pos / segLen), radius);
        if (loc && !seen.has(loc.pano)) {
          seen.add(loc.pano);
          panoList.push({ pano: loc.pano, latLng: loc.latLng });
        }
      }
      acc += segLen - pos; // Rest ins nächste Segment übertragen
    }
    if (myGen === gen) producerDone = true;
  }

  function nearestPano(latLng, radius) {
    bumpUsage(1); // jede Panorama-Suche = 1 Street-View-Anfrage
    return new Promise((resolve) => {
      svService.getPanorama(
        { location: latLng, radius, source: google.maps.StreetViewSource.OUTDOOR },
        (data, status) => resolve(status === "OK" ? data.location : null)
      );
    });
  }

  // Winkel-Interpolation auf kürzestem Weg (kein 359°→0°-Sprung)
  function lerpAngle(a, b, f) {
    let d = ((b - a + 540) % 360) - 180;
    return a + d * f;
  }

  let paused = false, running = false, needResync = false;
  let curIdx = 0, segElapsed = 0, shownIdx = -1, smoothHdg = 0, tourPano = null;
  // Verweildauer pro Panorama (ms) — Quelle ist das Feld, Regler schreibt hinein
  const stepMsLive = () => Math.max(200, (Number($("dwell").value) || 1.4) * 1000);
  // Regler ↔ Feld synchron halten
  $("speed").addEventListener("input", () => { $("dwell").value = (Number($("speed").value) / 1000).toFixed(1); });
  $("dwell").addEventListener("input", () => {
    $("speed").value = Math.min(6000, Math.max(300, (Number($("dwell").value) || 1.4) * 1000));
  });
  // Zoom passend zum Abstand: soweit reinzoomen, dass das nächste Bild fast deckungsgleich ist
  const zoomFor = (distM) => Math.min(1.8, Math.max(0.4, (distM || 12) * 0.08));

  function setPause(p) {
    if (paused && !p) needResync = true; // beim Fortsetzen Blick vom User übernehmen
    paused = p;
    $("pause").textContent = p ? "▶" : "⏸";
    $("controls").classList.toggle("paused", p); // Pause-Werkzeuge ein/aus
    if (p) refreshFav();
  }

  // --- Favoriten (lokale Ablage im Browser) ---
  const FAV_KEY = "svFavorites";
  const getFavs = () => { try { return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); } catch (e) { return []; } };
  const isFav = (panoId) => getFavs().some((f) => f.pano === panoId);
  function toggleFav() {
    const it = panoList[curIdx]; if (!it) return;
    const favs = getFavs(), at = favs.findIndex((f) => f.pano === it.pano);
    if (at >= 0) favs.splice(at, 1);
    else favs.push({ pano: it.pano, lat: it.latLng.lat(), lng: it.latLng.lng(), added: Date.now() });
    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
    refreshFav();
  }
  function refreshFav() {
    const it = panoList[curIdx];
    if (it) $("fav").classList.toggle("on", isFav(it.pano));
  }

  // Aktuelle Stelle im echten Google Maps / Street View öffnen
  function openInMaps() {
    const it = panoList[curIdx]; if (!it) return;
    const h = tourPano ? Math.round(tourPano.getPov().heading) : Math.round(headingAt(curIdx));
    const url = "https://www.google.com/maps/@?api=1&map_action=pano" +
      `&viewpoint=${it.latLng.lat()},${it.latLng.lng()}&heading=${h}`;
    window.open(url, "_blank");
  }

  // Zu einem Stopp springen (für Zurück-Button im Pause-Modus)
  function goToStop(idx) {
    idx = Math.max(0, Math.min(idx, panoList.length - 1));
    curIdx = idx; segElapsed = 0; shownIdx = idx;
    smoothHdg = headingAt(idx);
    tourPano.setPano(panoList[idx].pano); bumpUsage(1);
    tourPano.setPov({ heading: smoothHdg, pitch: 0, zoom: 0 });
    updateMini(idx); refreshFav();
    $("prog").textContent = `${idx + 1}`;
  }

  const sph = () => google.maps.geometry.spherical;
  // Fahrtrichtung an Panorama i = Peilung zum nächsten (bzw. vom vorherigen am Ende)
  function headingAt(i) {
    if (panoList[i + 1]) return sph().computeHeading(panoList[i].latLng, panoList[i + 1].latLng);
    if (panoList[i - 1]) return sph().computeHeading(panoList[i - 1].latLng, panoList[i].latLng);
    return 0;
  }
  const distAt = (i) => panoList[i + 1]
    ? sph().computeDistanceBetween(panoList[i].latLng, panoList[i + 1].latLng) : 12;

  function updateMini(idx) {
    const it = panoList[idx];
    if (!it || !miniMarker) return;
    miniMarker.setPosition(it.latLng); // Marker wandert; Karte zeigt die ganze Route
  }

  // Ein Viewer, on-the-fly. Zwischen verbundenen Panoramen blendet Google selbst über
  // (kein verdeckter zweiter Viewer, der beim Umschalten schwarz aufpoppt).
  function playTour(myGen) {
    running = true;
    setPause(false);
    $("controls").classList.add("show");
    $("panoA").style.opacity = 1; $("panoA").style.zIndex = 1;

    tourPano = panoA;
    $("minimap").classList.add("show");
    // Karte erst jetzt erstellen (Container ist sichtbar/hat Größe) — sonst rendert sie grau
    if (!miniMap) {
      miniMap = new google.maps.Map($("minimap-inner"), {
        zoom: 8, center: panoList[0].latLng,
        disableDefaultUI: true, clickableIcons: false,
        gestureHandling: "cooperative", keyboardShortcuts: false,
      });
      miniMarker = new google.maps.Marker({ map: miniMap });
    } else {
      google.maps.event.trigger(miniMap, "resize");
    }
    // Route als Linie einzeichnen (alte entfernen) und Karte darauf einpassen
    if (routeLine) routeLine.setMap(null);
    routeLine = new google.maps.Polyline({
      path: routePathCoords, map: miniMap,
      strokeColor: "#4c7dff", strokeWeight: 3, strokeOpacity: 0.9,
    });
    const b = new google.maps.LatLngBounds();
    routePathCoords.forEach((p) => b.extend(p));
    if (!b.isEmpty()) miniMap.fitBounds(b, 24);

    curIdx = 0; segElapsed = 0; shownIdx = 0; smoothHdg = headingAt(0);
    tourPano.setPano(panoList[0].pano); bumpUsage(1);
    tourPano.setPov({ heading: smoothHdg, pitch: 0, zoom: 0 });
    updateMini(0); refreshFav();

    return new Promise((resolve) => {
      let lastTs = null;
      function frame(ts) {
        if (myGen !== gen) return; // durch neue Tour ersetzt → stoppen
        if (lastTs == null) lastTs = ts;
        const dt = Math.min(100, ts - lastTs); lastTs = ts; // Sprung nach Tab-Wechsel abklemmen
        consumerIdx = curIdx;

        if (paused) {
          // Pause: Kamera frei (ziehen/zoomen), ◀ zurück, ★ merken, 🔗 in Maps öffnen
          setStatus("Pausiert ⏸ — umsehen · ◀ zurück · ★ merken · 🔗 öffnen");
          $("prog").textContent = `${curIdx + 1}`;
          requestAnimationFrame(frame);
          return;
        }

        const nxt = panoList[curIdx + 1];
        if (!nxt) {
          if (producerDone) {
            running = false;
            setStatus("Angekommen 🏁 — ⏸ zum Umsehen");
            setPause(true); // am Ziel anhalten statt Steuerung ausblenden
            requestAnimationFrame(frame);
            return;
          }
          setStatus("Lade nächstes Panorama…"); // Puffer leer → warten
          requestAnimationFrame(frame);
          return;
        }

        // Beim Weiterspielen dort ansetzen, wo der User hinschaut (kein Zurückschnappen)
        if (needResync) { smoothHdg = tourPano.getPov().heading; needResync = false; }

        segElapsed += dt;
        const f = Math.min(1, segElapsed / stepMsLive());
        const fx = $("fx").checked;
        smoothHdg = lerpAngle(smoothHdg, headingAt(curIdx), 0.08);
        tourPano.setPov({ heading: smoothHdg, pitch: 0, zoom: fx ? zoomFor(distAt(curIdx)) * f : 0 });
        $("prog").textContent = `${curIdx + 1}`;
        setStatus("Tour läuft… ▶");

        if (f >= 1) {
          curIdx++;
          segElapsed = 0;
          if (shownIdx !== curIdx) {
            tourPano.setPano(panoList[curIdx].pano); bumpUsage(1);
            shownIdx = curIdx; updateMini(curIdx); refreshFav();
          }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }

  $("pause").addEventListener("click", () => setPause(!paused));
  $("back").addEventListener("click", () => { if (paused && tourPano) goToStop(curIdx - 1); });
  $("fav").addEventListener("click", toggleFav);
  $("openmaps").addEventListener("click", openInMaps);
  $("miniIn").addEventListener("click", () => miniMap && miniMap.setZoom(miniMap.getZoom() + 1));
  $("miniOut").addEventListener("click", () => miniMap && miniMap.setZoom(miniMap.getZoom() - 1));
  $("collapse").addEventListener("click", () => { $("panel").classList.add("hidden"); $("menuToggle").classList.add("show"); });
  $("menuToggle").addEventListener("click", () => { $("panel").classList.remove("hidden"); $("menuToggle").classList.remove("show"); });

  $("go").addEventListener("click", async () => {
    const key = $("key").value.trim();
    if (!key) return setStatus("Bitte API-Key eingeben.", true);
    gen++; // alte Tour (Producer + Wiedergabe) sauber stilllegen
    running = false;
    localStorage.setItem("gmapsKey", key);
    $("go").disabled = true;
    try {
      setStatus("Lade Google Maps…");
      await loadGoogleMaps(key);
      if (!panoA) {
        const opts = {
          visible: true, motionTracking: false, motionTrackingControl: false,
          addressControl: false, showRoadLabels: false, fullscreenControl: false,
          disableDefaultUI: true, clickToGo: false, scrollwheel: true, // Mausrad-Zoom (v.a. im Pause-Modus)
        };
        panoA = new google.maps.StreetViewPanorama($("panoA"), opts);
        svService = new google.maps.StreetViewService();
      }
      setStatus("Suche Adressen & Route…");
      const origin = await resolveLocation($("start"));
      await sleep(1100); // Nominatim: max ~1 Anfrage/Sekunde
      const destination = await resolveLocation($("end"));
      const route = await routePath(origin, destination);
      routePathCoords = route.path; // für die Linie auf der Mini-Karte

      // Panoramen on-the-fly suchen (nur ein paar voraus), nicht die ganze Route vorab
      const myGen = gen;
      panoList = []; consumerIdx = 0; producerDone = false;
      running = true;
      const stepM = Math.max(5, Number($("stepM").value) || 20);
      const navi = $("navi").checked ? route.waypoints : null;
      startProducer(route.path, Number($("radius").value) || 60, stepM, navi, myGen);
      setStatus("Suche erste Panoramen…");
      while (myGen === gen && panoList.length < 2 && !producerDone) await sleep(80);
      if (myGen !== gen) return; // schon wieder ersetzt
      if (!panoList.length) throw new Error("Keine Street-View-Panoramen entlang der Route gefunden.");
      $("go").disabled = false; // während der Fahrt darf man eine neue Route starten
      await playTour(myGen);
    } catch (e) {
      console.error(e);
      setStatus(e.message || String(e), true);
    } finally {
      $("go").disabled = false;
    }
  });
</script>
